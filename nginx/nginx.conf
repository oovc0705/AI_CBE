user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ================= 日志格式 =================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ================= 性能优化 =================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # ================= Gzip 压缩 =================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ================= 安全响应头 =================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ================= 限流配置 =================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # ================= 上游服务 =================
    upstream backend_servers {
        least_conn;
        server host.docker.internal:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream storefront_servers {
        least_conn;
        server host.docker.internal:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream admin_servers {
        least_conn;
        server host.docker.internal:8001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ================= 共享代理参数 =================
    proxy_http_version 1.1;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ================= C端商城 (www) =================
    server {
        listen 80;
        server_name www.yourbrand.com yourbrand.com;

        # ACME Challenge for Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://storefront_servers;
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_servers;
        }

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            proxy_pass http://storefront_servers;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ================= B端后台 (admin) =================
    server {
        listen 80;
        server_name admin.yourbrand.com;

        # ACME Challenge for Certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://admin_servers;
            proxy_buffering off;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://backend_servers;
        }

        # 登录接口限流
        location /api/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://backend_servers;
        }
    }

    # ================= 默认服务器 (拒绝未配置域名) =================
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }
}
