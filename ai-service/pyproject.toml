[project]
name = "ai-service"
version = "0.1.0"
description = "AI-CBE 跨境电商 AI 服务：Admin Copilot + 智能客服"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # ---- Web 框架 ----
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",

    # ---- 模型路由（核心）----
    "litellm>=1.40",                 # 统一 DeepSeek/智谱/通义/Ollama 等多家模型

    # ---- HTTP 客户端（调 Java 后端）----
    "httpx>=0.27",

    # ---- 配置加载 ----
    "python-dotenv>=1.0",
    "pydantic-settings>=2.6",

    # ---- Redis（会话与缓存）----
    "redis>=5.0",

    # ---- 向量库与 embedding ----
    "chromadb>=0.5",                 # 本地向量库
    "sentence-transformers>=3.0",    # BGE-m3 本地 embedding

    # ---- 数据校验 ----
    "pydantic>=2.6",

    # ---- 数据库（Copilot 历史持久化）----
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
# LangGraph 生态（Agent 编排增强，目前用自研轻量编排器，留作后续切换）
graph = [
    "langgraph>=0.1",
    "langchain-core>=0.2",
]
# 开发工具
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["api", "core", "agents", "tools", "rag", "config", "models", "services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]
