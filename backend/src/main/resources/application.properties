spring.application.name=backend
server.port=${SERVER_PORT:8081}

# ================= 加载 backend/.env（Spring Boot 默认不读取，需显式导入） =================
spring.config.import=optional:file:.env[.properties]

# ================= 数据库配置 (从环境变量读取，本地开发可配在 .env 中) =================
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ================= JWT 配置 (密钥必须由环境变量/.env 提供，禁止硬编码默认值) =================
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ================= 开发环境演示口令兜底 (默认关闭，生产严禁开启) =================
app.dev-login-fallback=${DEV_LOGIN_FALLBACK:false}

# ================= 登录限流 (Redis 计数，多副本共享) =================
app.login-rate-limit.max-attempts=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
app.login-rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}

# ================= MyBatis 配置 =================
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.backend.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler

# ================= Flyway 数据库版本控制 =================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ================= Redis 配置 =================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ================= Docker Compose 自动检测（本地开发时关闭，避免在后端目录启动时报错） =================
spring.docker.compose.enabled=false

# ================= 日志 =================
logging.level.com.example.backend.mapper=debug
logging.level.com.example.backend.config.RequestLoggingFilter=info

# ================= CORS 配置 (环境变量注入，逗号分隔) =================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# ================= 站点配置 =================
app.site-url=${SITE_URL:https://mystore.com}

# ================= 客服联系方式 (环境变量注入) =================
app.support-email=${SUPPORT_EMAIL:support@mystore.com}
app.support-whatsapp=${SUPPORT_WHATSAPP:}

# ================= 信任徽章配置 (禁止数据库存储) =================
app.trust-badges.authentic=Authentic Guaranteed
app.trust-badges.shipping=Fast Shipping
app.trust-badges.returns=7-Day Free Returns
app.trust-badges.secure=Secure Checkout

# ================= Actuator =================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.health.db.enabled=true
management.health.redis.enabled=true
management.health.diskspace.enabled=true

# ================= API 文档（生产设 API_DOCS_ENABLED=false，swagger/api-docs 转为需鉴权） =================
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}

# ================= HikariCP Metrics (Prometheus format) =================
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
spring.datasource.hikari.register-mbeans=true
